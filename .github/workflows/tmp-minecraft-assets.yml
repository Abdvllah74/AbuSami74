name: Temporary Minecraft Asset Collector

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Ocean Ruins candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib
          API='https://minecraft.wiki/api.php'; UA='ChatGPT-Minecraft-Quiz-QA/1.0'
          out=pathlib.Path('assets'); out.mkdir(exist_ok=True)
          def api(p):
              u=API+'?'+urllib.parse.urlencode(p); req=urllib.request.Request(u,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=40) as r: return json.load(r)
          names=[]
          for title in ['Ocean Ruins','Ocean Ruins/Structure']:
              cont={}
              for _ in range(5):
                  p={'action':'query','format':'json','prop':'images','imlimit':'100','titles':title}; p.update(cont)
                  j=api(p); page=next(iter(j.get('query',{}).get('pages',{}).values()),{})
                  names += [x.get('title','') for x in page.get('images',[])]
                  if 'continue' not in j: break
                  cont=j['continue']
          names=list(dict.fromkeys(names))
          infos=[]
          for i in range(0,len(names),25):
              j=api({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|mime|size','titles':'|'.join(names[i:i+25])})
              for p in j.get('query',{}).get('pages',{}).values():
                  ii=(p.get('imageinfo') or [{}])[0]
                  if ii.get('url'): infos.append({'title':p.get('title',''),**ii})
          def score(i):
              n=i['title'].lower(); w=i.get('width',0); h=i.get('height',0)
              if i.get('mime') not in ('image/png','image/jpeg','image/webp') or w<150 or h<120: return -999
              s=(w*h)**0.5/40
              for k in ('ocean','ruin','warm','cold','underwater','screenshot','generated','structure'): 
                  if k in n: s+=15
              for k in ('sprite','icon','logo','map','blueprint','layer','invicon','blocksprite','itemsprite'):
                  if k in n: s-=45
              return s
          ranked=sorted([(score(i),i) for i in infos],key=lambda x:x[0],reverse=True)
          meta=[]; rank=0
          for sc,i in ranked:
              if sc<=0 or rank>=20: continue
              try:
                  req=urllib.request.Request(i['url'],headers={'User-Agent':UA,'Referer':'https://minecraft.wiki/'})
                  with urllib.request.urlopen(req,timeout=60) as r: data=r.read(); ct=r.headers.get_content_type()
                  ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}.get(ct)
                  if not ext: continue
                  rank+=1; fn=f'{rank:02d}.{ext}'; (out/fn).write_bytes(data)
                  meta.append({'rank':rank,'score':sc,'filename':fn,'wiki_file_title':i['title'].replace('File:',''),'image_url':i['url'],'width':i.get('width'),'height':i.get('height')})
              except Exception: pass
          (out/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('downloaded',len(meta),'candidates from',len(names),'file references')
          PY
      - name: Upload Ocean Ruins candidates
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ocean-ruins-candidates-v2
          path: assets/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
