name: Temporary Minecraft Asset Collector

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect scene-focused Minecraft Wiki images
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, pathlib, mimetypes, re

          topics = [
            ("MC-EASY-024","Nether Portal","mechanic"),("MC-EASY-025","Village","structure"),("MC-EASY-026","Desert Pyramid","structure"),("MC-EASY-027","Ocean Monument","structure"),("MC-EASY-028","Stronghold","structure"),("MC-EASY-029","Nether Fortress","structure"),("MC-EASY-030","Bastion Remnant","structure"),("MC-EASY-031","Overworld","dimension"),("MC-EASY-032","Nether","dimension"),("MC-EASY-033","The End","dimension"),("MC-EASY-034","Plains","biome"),("MC-EASY-035","Desert","biome"),("MC-EASY-036","Cherry Grove","biome"),("MC-EASY-037","Survival","game_mode"),("MC-EASY-038","Creative","game_mode"),
            ("MC-MEDIUM-031","Lush Caves","biome"),("MC-MEDIUM-032","Dripstone Caves","biome"),("MC-MEDIUM-033","Deep Dark","biome"),("MC-MEDIUM-034","Mangrove Swamp","biome"),("MC-MEDIUM-035","Mushroom Fields","biome"),("MC-MEDIUM-036","Woodland Mansion","structure"),("MC-MEDIUM-037","Pillager Outpost","structure"),("MC-MEDIUM-038","Ancient City","structure"),("MC-MEDIUM-039","Trial Chambers","structure"),("MC-MEDIUM-040","Mineshaft","structure"),
            ("MC-HARD-031","End City","structure"),("MC-HARD-032","Shipwreck","structure"),("MC-HARD-033","Ocean Ruins","structure"),("MC-HARD-034","Trail Ruins","structure"),("MC-HARD-035","Jungle Pyramid","structure"),("MC-HARD-036","Igloo","structure"),("MC-HARD-037","Ruined Portal","structure"),("MC-HARD-038","Nether Fossil","structure"),("MC-HARD-039","Amethyst Geode","structure")
          ]
          API="https://minecraft.wiki/api.php"
          UA="ChatGPT-Minecraft-Quiz-Scene-Collector/1.0 (personal quiz build)"
          out=pathlib.Path("assets"); out.mkdir(exist_ok=True)
          meta=[]

          def api(params):
              url=API+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=40) as r: return json.load(r)

          def list_images(title):
              names=[]; cont={}
              for _ in range(3):
                  p={"action":"query","format":"json","redirects":"1","prop":"images","imlimit":"100","titles":title}; p.update(cont)
                  j=api(p); page=next(iter(j.get("query",{}).get("pages",{}).values()),{})
                  names.extend(x.get("title","") for x in page.get("images",[]))
                  if "continue" not in j: break
                  cont=j["continue"]
              return names[:180]

          def info_batch(names):
              result=[]
              for i in range(0,len(names),25):
                  chunk=names[i:i+25]
                  j=api({"action":"query","format":"json","prop":"imageinfo","iiprop":"url|mime|size","titles":"|".join(chunk)})
                  for p in j.get("query",{}).get("pages",{}).values():
                      ii=(p.get("imageinfo") or [{}])[0]
                      if ii.get("url"):
                          result.append({"title":p.get("title",""),**ii})
              return result

          def score(info,cat):
              name=info["title"].lower(); w=info.get("width",0); h=info.get("height",0); mime=info.get("mime","")
              if not w or not h: return -9999
              ar=w/h
              s=0
              if mime in ("image/jpeg","image/png","image/webp"): s+=10
              if w>=1000: s+=25
              elif w>=700: s+=18
              elif w>=500: s+=8
              if h>=400: s+=8
              if 1.25<=ar<=2.2: s+=25
              elif 1.05<=ar<=2.6: s+=10
              good=("screenshot","view","exterior","entrance","inside","interior","natural","generated","terrain","biome","landscape","room","hall","corridor","surface","overworld","nether","end")
              bad=("icon","sprite","invicon","logo","map","layout","schematic","blueprint","render","isometric","model","structure jigsaw","gallery","comparison","concept","texture","block je","block be","item je","item be","edition")
              for k in good:
                  if k in name: s+=20
              for k in bad:
                  if k in name: s-=35
              if name.endswith(".svg"): s-=100
              if cat=="game_mode" and ("hud" in name or "inventory" in name or "creative" in name or "survival" in name): s+=25
              return s

          for code,title,cat in topics:
              rec={"code":code,"title":title,"category":cat,"status":"pending"}
              try:
                  j=api({"action":"query","format":"json","redirects":"1","titles":title})
                  page=next(iter(j.get("query",{}).get("pages",{}).values()),{})
                  resolved=page.get("title",title); rec["resolved_title"]=resolved
                  names=list_images(resolved)
                  infos=info_batch(names)
                  ranked=sorted(((score(i,cat),i) for i in infos),key=lambda x:x[0],reverse=True)
                  if not ranked or ranked[0][0] < 5: raise RuntimeError("No scene candidate")
                  bestscore,best=ranked[0]
                  rec["candidate_score"]=bestscore; rec["wiki_file_title"]=best["title"].replace("File:","")
                  rec["image_url"]=best["url"]; rec["width"]=best.get("width"); rec["height"]=best.get("height")
                  rec["wiki_page_url"]="https://minecraft.wiki/w/"+urllib.parse.quote(resolved.replace(" ","_"),safe="()_'-")
                  req=urllib.request.Request(best["url"],headers={"User-Agent":UA,"Referer":rec["wiki_page_url"]})
                  with urllib.request.urlopen(req,timeout=70) as r:
                      data=r.read(); ctype=r.headers.get_content_type()
                  ext=pathlib.Path(urllib.parse.urlparse(best["url"]).path).suffix.lower()
                  if ext not in (".png",".jpg",".jpeg",".webp",".gif"): ext=mimetypes.guess_extension(ctype) or ".img"
                  fname=code+ext; (out/fname).write_bytes(data)
                  rec.update({"status":"downloaded","filename":fname,"bytes":len(data),"content_type":ctype})
              except Exception as e:
                  rec.update({"status":"error","error":repr(e)})
              meta.append(rec); print(code,title,rec["status"],rec.get("wiki_file_title",rec.get("error","")))
              time.sleep(.08)
          (out/"metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Downloaded",sum(x["status"]=="downloaded" for x in meta),"/",len(meta))
          PY

      - name: Upload scene replacements
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-scene-replacements-v2
          path: assets/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
